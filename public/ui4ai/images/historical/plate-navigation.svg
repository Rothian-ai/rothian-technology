    <path d="M46 232 A 60 60 0 0 1 106 172" stroke-opacity="0.2"/>
  </g>
  <g fill="#F4F2ED" fill-opacity="0.5">
    <!-- waypoints -->
    <rect x="43" y="229" width="6" height="6" transform="rotate(45 46 232)"/>
    <rect x="197" y="129" width="5" height="5" transform="rotate(45 199.5 131.5)"/>
    <rect x="431" y="71" width="6" height="6" transform="rotate(45 434 74)"/>
  </g>
  <g fill="#F4F2ED" fill-opacity="0.24" font-family="ui-monospace, monospace" font-size="8" letter-spacing="1.4">
    <text x="20" y="26">25°12'N</text>
    <text x="20" y="42">55°16'E</text>
    <text x="352" y="272">BEARING 041</text>
  </g>
</svg>
