<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" fill="none" role="img" aria-label="Navigation chart plate">
  <g stroke="#F4F2ED" stroke-opacity="0.3" stroke-width="0.8" fill="none">
    <!-- graticule -->
    <path d="M0 60 H480 M0 120 H480 M0 180 H480 M0 240 H480" stroke-opacity="0.09"/>
    <path d="M60 0 V300 M120 0 V300 M180 0 V300 M240 0 V300 M300 0 V300 M360 0 V300 M420 0 V300" stroke-opacity="0.09"/>
    <!-- horizon curve -->
    <path d="M-10 214 Q 240 178 490 214" stroke-opacity="0.24"/>
    <!-- plotted route -->
    <path d="M46 232 C 150 128, 300 96, 434 74" stroke-opacity="0.55" stroke-dasharray="6 5"/>
    <path d="M46 232 C 120 190, 210 200, 300 148" stroke-opacity="0.2"/>
    <!-- compass rose -->
    <circle cx="386" cy="216" r="34" stroke-opacity="0.22"/>
    <circle cx="386" cy="216" r="21" stroke-opacity="0.14"/>
    <path d="M386 176 V256 M346 216 H426" stroke-opacity="0.22"/>
    <path d="M386 182 L394 216 L386 250 L378 216 Z" stroke-opacity="0.42"/>
